<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Startup — Pre-Seed Evaluation Platform</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* OST VI6 brand palette */
    --ost-navy:#0A193D;
    --ost-dark-navy:#090F1E;
    --ost-white:#FFFFFF;
    --ost-off-white:#F2EFE9;
    --ost-green:#5CD45E;    /* chosen single secondary accent for this platform */

    --bg:var(--ost-off-white);
    --surface:var(--ost-white);
    --ink:var(--ost-navy);
    --muted:#5B6478;
    --line:#DEDACE;
    --accent:var(--ost-green);
    --accent-dark:#3EB941;
    --accent-soft:#E6F9E6;
    --gold:#5B6478;
    --gold-soft:#ECEDF1;
    --danger:#B3432E;
    --danger-soft:#F6E6E1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Graphik',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Graphik',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:900;letter-spacing:-0.01em;}
  .mono{font-variant-numeric:tabular-nums;font-weight:700;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- shell ---------- */
  #app{min-height:100vh;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;background:var(--ost-navy);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:28px;height:28px;color:var(--ost-white);flex-shrink:0;}
  .brand-name{font-weight:900;font-size:15px;letter-spacing:0.2px;color:var(--ost-white);}
  .brand-tag{font-size:11px;color:rgba(255,255,255,0.6);margin-top:-2px;}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(255,255,255,0.7);}
  .who b{color:var(--ost-white);}
  .logout{border:1px solid rgba(255,255,255,0.3);background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;color:rgba(255,255,255,0.8);}
  .logout:hover{border-color:var(--danger);color:#ff8a70;}

  .center-screen{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 1px 2px rgba(20,20,10,0.04);}
  .card h2{margin:0 0 6px;font-size:22px;}
  .card p.sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#FCFCFA;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:disabled{background:#B9C4BE;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-block{width:100%;}
  .role-pick{display:flex;flex-direction:column;gap:12px;}
  .role-btn{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;}
  .role-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .role-icon{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-dark);flex-shrink:0;font-size:19px;}
  .role-btn:hover .role-icon{background:var(--accent);color:#fff;}
  .landing-hero{position:relative;background:var(--ost-dark-navy);overflow:hidden;}
  .hero-circle{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,0.12);pointer-events:none;}
  .hero-circle.c1{width:420px;height:420px;top:-160px;left:-120px;}
  .hero-circle.c2{width:260px;height:260px;bottom:-100px;right:8%;border-color:rgba(92,212,94,0.18);}
  .hero-circle.c3{width:160px;height:160px;top:20%;right:-60px;}
  .role-title{font-weight:600;font-size:14.5px;}
  .role-desc{font-size:12.5px;color:var(--muted);}
  .error-msg{color:var(--danger);font-size:12.5px;margin-top:8px;}
  .back-link{background:none;border:none;color:var(--muted);font-size:12.5px;margin-bottom:18px;padding:0;text-decoration:underline;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--surface);}
  .tab{padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .content{padding:24px 28px;max-width:1200px;margin:0 auto;}

  /* ---------- generic ---------- */
  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .section-title{font-size:18px;margin:0 0 4px;}
  .section-sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11.5px;font-weight:600;}
  .pill-pending{background:var(--gold-soft);color:var(--gold);}
  .pill-done{background:var(--accent-soft);color:var(--accent);}
  .tab-pill{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:100px;font-size:12.5px;font-weight:600;color:var(--muted);}
  .tab-pill:hover{border-color:var(--accent);}
  .tab-pill.active{background:var(--ost-navy);border-color:var(--ost-navy);color:#fff;}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:36px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* ---------- upload ---------- */
  .dropzone{border:1.5px dashed var(--line);border-radius:12px;padding:32px;text-align:center;background:#FCFCFA;}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone input[type=file]{display:none;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.3px;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:#FAFAF7;}
  .table-wrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:#fff;-webkit-overflow-scrolling:touch;}
  .icon-btn{border:none;background:none;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:12px;}
  .icon-btn:hover{color:var(--danger);background:var(--danger-soft);}
  .startup-list{display:flex;flex-direction:column;gap:10px;}
  .startup-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s;}
  .startup-card:hover{border-color:var(--accent);}
  .su-name{font-weight:600;font-size:14.5px;}
  .su-meta{font-size:12px;color:var(--muted);margin-top:2px;}

  /* score gauge */
  .gauge{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:'JetBrains Mono',monospace;flex-shrink:0;border:3px solid var(--line);}

  /* ---------- evaluator detail split ---------- */
  .detail-shell{display:grid;grid-template-columns:380px 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-height:70vh;}
  .panel-left{border-right:1px solid var(--line);padding:24px;background:#FCFCFA;}
  .panel-right{padding:28px 32px;overflow-y:auto;max-height:80vh;}
  .crit-row{margin-bottom:10px;}
  .crit-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .crit-label{font-size:13px;font-weight:600;}
  .crit-value{font-family:'Graphik',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent-dark);font-size:14px;flex-shrink:0;}
  .crit-header{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .crit-header:hover{border-color:var(--accent);}
  .crit-header.scored{border-color:var(--accent);background:var(--accent-soft);}
  .crit-header.open{border-color:var(--accent-dark);box-shadow:0 0 0 1px var(--accent-dark);}
  .crit-header-main{flex:1;min-width:0;}
  .crit-check{color:var(--accent-dark);font-weight:900;}
  .crit-preview{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .crit-chevron{color:var(--muted);font-size:12px;flex-shrink:0;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .save-bar{position:sticky;bottom:0;background:#FCFCFA;padding-top:16px;margin-top:8px;border-top:1px solid var(--line);}
  .info-block{margin-bottom:22px;}
  .info-block h4{font-size:11.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin:0 0 8px;font-weight:700;}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px;}
  .kv div:nth-child(odd){color:var(--muted);}
  .rubric-total-bar{position:sticky;top:0;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;z-index:5;}
  .rubric-total-bar .label{font-size:12px;color:var(--accent-dark);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
  .rubric-total-bar .value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--accent-dark);}
  .rubric-category{margin-bottom:24px;padding-bottom:4px;}
  .rubric-cat-head{display:flex;justify-content:space-between;align-items:baseline;font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .rubric-cat-head .mono{color:var(--muted);font-size:12px;}
  .anchor-group{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:0 2px;}
  .anchor-btn{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;line-height:1.4;color:var(--ink);}
  .anchor-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .anchor-btn.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
  .anchor-points{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent);flex-shrink:0;min-width:18px;}
  .anchor-label{color:var(--muted);}
  .anchor-btn.selected .anchor-label{color:var(--ink);}
  .gonogo-row{display:flex;gap:10px;margin:20px 0;}
  .gonogo-btn{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;text-align:center;}
  .gonogo-btn.go.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .gonogo-btn.nogo.selected{background:var(--danger);border-color:var(--danger);color:#fff;}
  .type-warning{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:14px 16px;font-size:13px;}
  .qa-list{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
  .qa-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s;}
  .qa-item:hover{border-color:var(--accent);}
  .qa-q{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:700;color:var(--ost-navy);line-height:1.4;margin-bottom:10px;}
  .qa-q-badge{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;margin-top:1px;}
  .qa-a{font-size:14.5px;line-height:1.7;white-space:pre-wrap;color:var(--ink);padding-left:34px;}
  .qa-count{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 4px;}
  .stepper{display:flex;gap:6px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .step-dot{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:600;color:var(--muted);min-width:84px;text-align:center;}
  .step-dot.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
  .step-dot.final.active{border-color:var(--ost-navy);background:#EDEEF2;color:var(--ost-navy);}
  .step-dot .step-sub{font-family:'Graphik',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;}
  .step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;}
  .step-nav .btn{flex:1;}
  .memo-text{font-size:14px;line-height:1.65;white-space:pre-wrap;}
  .back-row{margin-bottom:18px;}

  /* results */
  .agg-row{cursor:pointer;}
  .expand-panel{background:#FAFAF7;padding:16px 20px;border-bottom:1px solid var(--line);}
  .eval-score-card{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .eval-score-card:last-child{border-bottom:none;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;}

  .assign-grid{display:grid;grid-template-columns:1fr;gap:8px;max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;}
  .assign-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:13px;}
  .assign-item:hover{background:var(--accent-soft);}
  .assign-item input{width:auto;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:100;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:900px){
    .detail-shell{grid-template-columns:1fr;}
    .panel-left{border-right:none;border-bottom:1px solid var(--line);}
    .panel-right{max-height:none;overflow-y:visible;}
    .rubric-total-bar{position:static;}
  }

  @media (max-width:640px){
    .topbar{padding:12px 16px;}
    .brand-tag{display:none;}
    .who{font-size:12px;gap:8px;}
    .content{padding:16px;}
    .tabs{padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab{padding:10px 12px;font-size:12.5px;white-space:nowrap;}
    .card{padding:24px 20px;}
    .center-screen{padding:16px;}
    .row-between{flex-wrap:wrap;gap:10px;}
    .startup-card{flex-wrap:wrap;gap:10px;}
    .kv{grid-template-columns:1fr;gap:2px 0;}
    .kv div:nth-child(odd){margin-top:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:0.3px;}
    .kv div:first-child{margin-top:0;}
    th, td{padding:8px;font-size:12px;}
    .anchor-btn{padding:10px 12px;}
    .toast{left:12px;right:12px;bottom:16px;max-width:none;text-align:center;}
    .section-title{font-size:16.5px;}
    .assign-grid{max-height:260px;}
    .field input, .field select, .field textarea{font-size:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* ============ FIREBASE / FIRESTORE SETUP ============ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBiWemdOcEBXjNRO0IyRCNjuCq0Tx_X0Ac",
  authDomain: "ost2026-5b876.firebaseapp.com",
  projectId: "ost2026-5b876",
  storageBucket: "ost2026-5b876.firebasestorage.app",
  messagingSenderId: "57167677056",
  appId: "1:57167677056:web:47dc4393ac33b3e6c60865"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const COLLECTION = 'dealroom';

/* ============ STORAGE HELPERS (backed by Firestore) ============ */
const K = {
  startups: 'startups',
  evaluators: 'evaluators',
  scores: 'scores',
  criteria: 'criteria',
  adminCode: 'admin_code',
  resources: 'resources'
};

async function sget(key, fallback){
  try{
    const snap = await getDoc(doc(db, COLLECTION, key));
    if(!snap.exists()) return fallback;
    const data = snap.data();
    return data && data.json ? JSON.parse(data.json) : fallback;
  }catch(e){ console.error('storage get failed', key, e); return fallback; }
}
async function sset(key, value){
  try{
    await setDoc(doc(db, COLLECTION, key), { json: JSON.stringify(value) });
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

/* ============ SCORING RUBRICS ============ */
// Categories shared by both Deeptech and Tech-enabled at the Pre-Seed stage.
const SHARED_CATEGORIES_PRESEED = [
  {
    id:'team', label:'1. Team Strength & Inclusion', maxPoints:25,
    subcriteria:[
      {key:'founder_commitment', label:'Full-time founder commitment', maxPoints:5, anchors:[
        {points:5, label:'All co-founders are full-time'},
        {points:3, label:'Only the lead founder is full-time'},
        {points:1, label:'All founders are part-time'},
        {points:0, label:'No full-time founder commitment'}
      ]},
      {key:'team_size', label:'Team size & capacity', maxPoints:4, anchors:[
        {points:4, label:'Team of 5 or more people'},
        {points:3, label:'Team of 3-4'},
        {points:2, label:'Team of 2'},
        {points:1, label:'Solo founder'},
        {points:0, label:'No operational team'}
      ]},
      {key:'female_team', label:'Female team members', maxPoints:2, anchors:[
        {points:2, label:'\u226530% of the team are women'},
        {points:1, label:'At least 1 woman on the team'},
        {points:0, label:'No female team members'}
      ]},
      {key:'women_leadership', label:'Women in leadership roles', maxPoints:2, anchors:[
        {points:2, label:'At least one woman in a founder or executive role (CXO)'},
        {points:1, label:'Women present but not in leadership'},
        {points:0, label:'No women in leadership'}
      ]},
      {key:'youth', label:'Youth representation (<35)', maxPoints:2, anchors:[
        {points:2, label:'\u226550% of the team is under 35 years old'},
        {points:1, label:'Some team members under 35, but <50%'},
        {points:0, label:'No team members under 35'}
      ]},
      {key:'team_complementarity', label:'Team complementarity (via NLP)', maxPoints:5, anchors:[
        {points:5, label:'Clear, well-balanced roles with complementary skills (e.g. tech, business, operations)'},
        {points:4, label:'Mostly complementary roles, minor overlaps or gaps'},
        {points:3, label:'Some differentiation, but roles are unclear or overlapping'},
        {points:2, label:'Minimal complementarity or unclear responsibilities'},
        {points:1, label:'All founders have similar profiles or unclear functions'},
        {points:0, label:'No information provided or roles completely unclear'}
      ]},
      {key:'team_credentials', label:'Team credentials', maxPoints:5, anchors:[
        {points:5, label:'Strong, relevant experience in the sector; proven track record'},
        {points:4, label:'Relevant experience, but limited in years or sector depth'},
        {points:3, label:'Somewhat relevant background, transferable skills'},
        {points:2, label:'Limited experience or unrelated background'},
        {points:1, label:'Minimal experience; weak fit for the challenge'},
        {points:0, label:'No relevant credentials or unclear background'}
      ]}
    ]
  },
  {
    id:'solution', label:'3. Solution Clarity & Impact', maxPoints:25,
    subcriteria:[
      {key:'problem_definition', label:'Problem definition (via NLP)', maxPoints:6, anchors:[
        {points:6, label:'Problem is specific, urgent, and well-evidenced, with clear impact'},
        {points:5, label:'Problem is clear and relevant but lacks urgency or context'},
        {points:3, label:'Problem is understood but somewhat generic or missing real-world grounding'},
        {points:2, label:'Problem is vague or overly broad'},
        {points:1, label:'Problem is unclear or not articulated'},

// Best-effort auto-detect of Deeptech vs Tech-enabled from F6S text fields; admin can always override.
const DEEPTECH_HINTS = ['deep tech','deeptech','deep-tech','biotech','medtech','life science','hardware','robotics','materials science','nanotech','semiconductor','space tech','cleantech hardware','synthetic biology','quantum','photonics'];
function guessStartupType(row){
  const haystack = [row.sector, row.oneLiner, row.description, row.differentiators]
    .filter(Boolean).join(' ').toLowerCase();
  for(const hint of DEEPTECH_HINTS){
    if(haystack.includes(hint)) return 'deeptech';
  }
  return 'tech-enabled';
}

// Parses a row from the rich "application" sheet (columns like "Question 38: ...",
// "Question 73: ... (Currency)") into a clean {basics, qa} structure.
function mapApplicationRow(row){
  const lower = {};
  Object.keys(row).forEach(k => { lower[normalizeHeader(k)] = row[k]; });
  const getVal = (headerKey) => {
    const v = lower[normalizeHeader(headerKey)];
    return (v !== undefined && v !== null && String(v).trim() !== '') ? String(v).trim() : '';
  };

  const basics = {
    contactName: getVal('Primary Contact Name'),
    contactTitle: getVal('Primary Contact Title'),
    contactEmail: getVal('Primary Contact Email Address'),
    city: getVal('City'),
    country: getVal('Country'),
    briefDescription: getVal('Brief Description'),
    skillsOrMarkets: getVal('Skills or Markets'),
    startDate: getVal('When did you start this company?'),
    incorporatedYesNo: getVal('Are you registered or incorporated?'),
    whatDoYouDo: getVal('What do you do in detail?'),
    whatsDifferent: getVal("What's different/interesting about your Startup?") || getVal('What\u2019s different/interesting about your Startup?'),
    howFarAlong: getVal('How far along are you?'),
    runway: getVal('How much runway do you have left?'),
    raising: getVal('Raising'),
    amountRaising: getVal('Amount Raising'),
    amountCurrency: getVal('Amount Currency'),
    valuation: getVal('Valuation'),
    valuationCurrency: getVal('Valuation Currency'),
    fundStage: getVal('Fund Stage'),
    founderExperience: getVal('Person 1 Experience')
  };

  // Parse every "Question N: <text>" column, combining amount + "(Currency)" pairs into one answer
  const raw = {};
  Object.keys(row).forEach(origKey => {
    const m = String(origKey).match(/^Question (\d+):\s*(.*)$/s);
    if(!m) return;
    const num = parseInt(m[1], 10);
    const label = m[2].trim();
    const isCurrency = /\(Currency\)\s*$/.test(label);
    const baseLabel = label.replace(/\s*\(Currency\)\s*$/, '').trim();
    const val = row[origKey];
    if(val === undefined || val === null || String(val).trim() === '') return;
    if(!raw[num]) raw[num] = { label: baseLabel, value: '', currency: '' };
    if(isCurrency) raw[num].currency = String(val).trim();
    else { raw[num].value = String(val).trim(); raw[num].label = baseLabel; }
  });

  const qa = {};
  Object.keys(raw).forEach(numStr => {
    const num = +numStr;
    const item = raw[num];
    let answer = item.value;
    if(item.currency && answer) answer = answer + ' ' + item.currency;
    if(answer) qa[num] = { question: item.label, answer };
  });

  return { basics, qa };
}

// Merges rich application-sheet data into a startup already built from the Pipeline sheet.
// Fills gaps in existing fields rather than overwriting good data, and refines the
// Deeptech/Tech-enabled guess using the founder's own self-declared answer (Q2) when present.
function mergeApplicationIntoStartup(startup, appRow){
  const app = mapApplicationRow(appRow);
  startup.application = app;
  const b = app.basics;
  if(!startup.oneLiner && b.briefDescription) startup.oneLiner = b.briefDescription;
  if(!startup.description && b.whatDoYouDo) startup.description = b.whatDoYouDo;
  if(!startup.differentiators && b.whatsDifferent) startup.differentiators = b.whatsDifferent;
  if(!startup.country && b.country) startup.country = b.country;
  if(!startup.founded && b.startDate) startup.founded = b.startDate;
  if(!startup.incorporated && b.incorporatedYesNo) startup.incorporated = b.incorporatedYesNo;
  if(!startup.cashRunway && b.runway) startup.cashRunway = b.runway;
  if(!startup.email && b.contactEmail) startup.email = b.contactEmail;

  const q2 = app.qa[2];
  if(q2 && q2.answer){
    const a = q2.answer.toLowerCase();
    if(a.includes('tech-enabled')) startup.type = 'tech-enabled';
    else if(a.includes('deep') || a.includes('science')) startup.type = 'deeptech';
  }
}

// Renders the Q&A relevant to one rubric category, straight from the founder's own answers.
function categoryQAHtml(catId, s){
  const qa = s.application && s.application.qa;
  if(!qa) return '';
  const nums = (CATEGORY_QUESTIONS[catId] || []).filter(n => qa[n]);
  if(!nums.length) return '';
  return `
    <p class="qa-count">${nums.length} application question${nums.length===1?'':'s'} for this category</p>
    <div class="qa-list">
      ${nums.map(n => `
        <div class="qa-item">
          <div class="qa-q"><span class="qa-q-badge">${n}</span><span>${esc(qa[n].question)}</span></div>
          <div class="qa-a">${esc(qa[n].answer)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

const NOISE_COLUMNS = ['startup id','your score','avg score','assigned evaluators','completed by','start app','finalize app','last contact','source 1 name','source 1 type','interfaces','rounds','# individuals','pipeline','tags','google plus'];

function normalizeHeader(h){ return (h||'').toString().trim().toLowerCase(); }

// Some exports (e.g. F6S) prepend a title row before the real column headers.
// Scan the first several rows and pick the first one that looks like a real header
// row (most cells filled in), rather than assuming row 1 is always it.
function arrayGridToObjects(grid){
  if(!grid || !grid.length) return [];
  let headerIdx = 0;
  const scanLimit = Math.min(grid.length, 10);
  for(let i=0; i<scanLimit; i++){
    const row = grid[i] || [];
    const filled = row.filter(c => c !== undefined && c !== null && String(c).trim() !== '').length;
    if(filled >= Math.max(3, Math.ceil(row.length * 0.5))){
      headerIdx = i;
      break;
    }
  }
  const headerRow = grid[headerIdx] || [];
  const dataRows = grid.slice(headerIdx + 1);
  return dataRows
    .map(row => {
      const obj = {};
      headerRow.forEach((h, ci) => {
        const key = (h ?? '').toString().trim();
        if(key) obj[key] = row[ci] !== undefined ? row[ci] : '';
      });
      return obj;
    })
    .filter(obj => Object.values(obj).some(v => v !== '' && v !== undefined && v !== null));
}

function mapCsvRow(row){
  const lowerRow = {};
  Object.keys(row).forEach(k => lowerRow[normalizeHeader(k)] = row[k]);
  const out = { extra: {}, founderList: [], links: {} };
  const usedKeys = new Set();

  const pick = (key)=>{
    if(lowerRow[key] !== undefined && lowerRow[key] !== ''){
      usedKeys.add(key);
      return String(lowerRow[key]).trim();
    }
    return '';
  };

  for(const field in FIELD_MAP){
    let found = null;
    for(const candidate of FIELD_MAP[field]){
      if(lowerRow[candidate] !== undefined && lowerRow[candidate] !== ''){
        found = lowerRow[candidate];
        usedKeys.add(candidate);
        break;
      }
    }
    out[field] = found ? String(found).trim() : '';
  }

  // F6S splits founders into separate "Founder N Name" / "Founder N Role" columns; combine them
  // both into a display string (out.founders) and a structured list (out.founderList).
  for(let n=1; n<=5; n++){
    const nameKey = 'founder '+n+' name';
    const roleKey = 'founder '+n+' role';
    if(lowerRow[nameKey]){
      usedKeys.add(nameKey);
      const role = lowerRow[roleKey] ? String(lowerRow[roleKey]).trim() : '';
      if(lowerRow[roleKey]) usedKeys.add(roleKey);
      out.founderList.push({ name: String(lowerRow[nameKey]).trim(), role });
    }
  }
  if(!out.founders && out.founderList.length){
    out.founders = out.founderList.map(f => f.role ? f.name+' ('+f.role+')' : f.name).join(', ');
  }

  // Structured application sections (Company snapshot, Pitch, Traction, Fundraising, Links)
  out.founded = pick('founded');
  out.incorporated = pick('incorporated');
  out.university = pick('university');
  out.differentiators = pick('differentiators');
  out.description = pick('description');
  out.milestone = pick('milestone');
  out.revenueModel = pick('revenue model');
  out.totalFunding = pick('total funding');
  out.cashRunway = pick('cash runway');
  out.clients = pick('clients');
  out.revLast12Months = pick('rev last 12 months');
  out.revLastMonth = pick('rev last month');
  out.roundAmount = pick('f6s listed round amount');
  out.roundAmountCurrency = pick('f6s listed round amount currency');
  out.roundValuation = pick('f6s listed round valuation amount');
  out.roundValuationCurrency = pick('f6s listed round valuation currency');
  out.roundStatus = pick('f6s listed round status');
  out.roundType = pick('f6s listed round type');
  out.roundUpdated = pick('f6s listed round updated date');
  out.links.website2 = pick('angellist');
  out.links.linkedin = pick('linkedin');
  out.links.github = pick('github');
  out.links.twitter = pick('twitter');
  out.links.facebook = pick('facebook');
  out.files = pick('files');
  out.videos = pick('videos');
  out.decks = pick('decks');
  out.notes = pick('notes');

  // Fall back oneLiner to a trimmed description if no tagline/pitch was found
  if(!out.oneLiner && out.description){
    out.oneLiner = out.description.length > 160 ? out.description.slice(0,157)+'…' : out.description;
  }

  // Drop known admin/meta noise columns silently, keep everything else genuinely leftover as extra
  NOISE_COLUMNS.forEach(nc => { if(lowerRow[nc] !== undefined) usedKeys.add(nc); });
  Object.keys(row).forEach(origKey => {
    const norm = normalizeHeader(origKey);
    if(!usedKeys.has(norm) && row[origKey] !== undefined && row[origKey] !== ''){
      out.extra[origKey] = row[origKey];
    }
  });
  out.name = out.name || '(unnamed startup)';
  out.track = 'pre-seed';
  out.type = guessStartupType(out);
  return out;
}

      <div class="error-msg" id="adminErr" style="display:none;"></div>
    </div>
  </div>`;
}
function localStorage_stub_flag(){ return true; }

async function attachAdminGate(){
  document.getElementById('backHome').onclick = ()=>{ S.view='landing'; render(); };
  if(S.adminCodeExists === undefined){
    const existing = await sget(K.adminCode, null);
    S.adminCodeExists = !!existing;
    render();
    return;
  }
  document.getElementById('adminCodeSubmit').onclick = async ()=>{
    const val = document.getElementById('adminCodeInput').value.trim();
    const err = document.getElementById('adminErr');
    const btn = document.getElementById('adminCodeSubmit');
    if(!val){ err.textContent='Please enter a code.'; err.style.display='block'; return; }
    err.style.display='none';
    if(!S.adminCodeExists){
      btn.disabled = true; btn.textContent = 'Saving…';
      const saved = await sset(K.adminCode, val);
      // Verify the save actually landed before trusting it (Firestore rules/network issues fail silently otherwise)
      const confirmRead = await sget(K.adminCode, null);
      if(!saved || confirmRead !== val){
        btn.disabled = false; btn.textContent = 'Create & continue';
        err.textContent = "Couldn't save the admin code, check your Firestore rules are published, then try again.";
        err.style.display = 'block';
        return;
      }
      S.adminCodeExists = true;
      S.adminAuthed = true;
      localStorage.setItem('dealroom_admin_authed', '1');
      toast('Admin code created');
      render();
    } else {
      const existing = await sget(K.adminCode, null);
      if(val === existing){
        S.adminAuthed = true;
        localStorage.setItem('dealroom_admin_authed', '1');
        render();
      }
      else { err.textContent='Incorrect code.'; err.style.display='block'; }
    }
  };
}

function attachAdminStartups(){
  document.querySelectorAll('[data-track-filter]').forEach(b=>{
    b.onclick = ()=>{ S.adminStartupTrackFilter = b.dataset.trackFilter; render(); };
  });
  document.querySelectorAll('[data-type-filter]').forEach(b=>{
    b.onclick = ()=>{ S.adminStartupTypeFilter = b.dataset.typeFilter; render(); };
  });
  const csvInput = document.getElementById('csvInput');
  if(csvInput){
    csvInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const lowerName = file.name.toLowerCase();
      const isExcel = lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls');

      const finishMappedRows = (mappedRows)=>{
        const rows = mappedRows.filter(r=>(r.name && r.name !== '(unnamed startup)') || Object.keys(r.extra).length || r.application);
        if(rows.length === 0){ toast('No rows found in that file'); return; }
        S.csvPreview = rows;
        render();
      };

      if(isExcel){
        const reader = new FileReader();
        reader.onload = (evt)=>{
          try{
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type:'array' });
            const sheetNames = workbook.SheetNames;
            const pipelineSheetName = sheetNames.find(n => /pipeline/i.test(n)) || sheetNames[0];
            const otherSheetNames = sheetNames.filter(n => n !== pipelineSheetName);

            const pipelineGrid = XLSX.utils.sheet_to_json(workbook.Sheets[pipelineSheetName], { header:1, defval:'' });
            const startupRows = arrayGridToObjects(pipelineGrid).map(mapCsvRow);

            if(otherSheetNames.length){
              // If more than one non-pipeline sheet exists, use the richest one (most columns)
              let bestName = otherSheetNames[0], bestCols = 0;
              otherSheetNames.forEach(n=>{
                const g = XLSX.utils.sheet_to_json(workbook.Sheets[n], { header:1, defval:'' });
                const cols = g[0] ? g[0].length : 0;
                if(cols > bestCols){ bestCols = cols; bestName = n; }
              });
              const appGrid = XLSX.utils.sheet_to_json(workbook.Sheets[bestName], { header:1, defval:'' });
              const appRows = arrayGridToObjects(appGrid);

              const nameKeyOf = (v) => String(v||'').trim().toLowerCase();
              const appByName = {};
              appRows.forEach(row=>{
                const nm = nameKeyOf(row['Startup/Person Name'] || row['Item Name'] || row['Name']);
                if(nm) appByName[nm] = row;
              });

              startupRows.forEach(startup=>{
                const appRow = appByName[nameKeyOf(startup.name)];
                if(appRow) mergeApplicationIntoStartup(startup, appRow);
              });

              // Application rows with no matching pipeline row still get included
              const matchedNames = new Set(startupRows.map(s=>nameKeyOf(s.name)));
              appRows.forEach(row=>{
                const nm = nameKeyOf(row['Startup/Person Name'] || row['Item Name'] || row['Name']);
                if(nm && !matchedNames.has(nm)){
                  const startup = mapCsvRow({ 'Item Name': row['Startup/Person Name'] || 'Unnamed Startup' });
                  mergeApplicationIntoStartup(startup, row);
                  startupRows.push(startup);
                }
              });
            }

            finishMappedRows(startupRows);
          }catch(err){ console.error(err); toast('Could not parse that Excel file'); }
        };
        reader.onerror = ()=>{ toast('Could not read that file'); };
        reader.readAsArrayBuffer(file);
      } else {
        Papa.parse(file, {
          header:false, skipEmptyLines:true,
          complete: (results)=>{ finishMappedRows(arrayGridToObjects(results.data).map(mapCsvRow)); },
          error: ()=>{ toast('Could not parse that CSV'); }
        });
      }
    };
  }
  document.querySelectorAll('[data-i]').forEach(inp=>{
    const handler = ()=>{
      const i = +inp.dataset.i, f = inp.dataset.f;
      S.csvPreview[i][f] = inp.value;
    };
    inp.oninput = handler;
    inp.onchange = handler;
  });
  document.querySelectorAll('[data-set-type]').forEach(sel=>{
    sel.onchange = async ()=>{
      const startup = S.startups.find(s=>s.id===sel.dataset.setType);
      startup.type = sel.value;
      await sset(K.startups, S.startups);
      toast('Type updated');
    };
  });
  document.querySelectorAll('[data-set-track]').forEach(sel=>{
    sel.onchange = async ()=>{
      const startup = S.startups.find(s=>s.id===sel.dataset.setTrack);
      startup.track = sel.value;
      await sset(K.startups, S.startups);
      toast('Track updated');
    };
  });
  document.querySelectorAll('[data-remove]').forEach(b=>{
    b.onclick = ()=>{ S.csvPreview.splice(+b.dataset.remove,1); render(); };
  });
  const confirmBtn = document.getElementById('confirmSave');
  if(confirmBtn){
    confirmBtn.onclick = async ()=>{
      const newOnes = S.csvPreview.map(r => ({...r, id: uid('su'), memo:''}));
      S.startups = [...S.startups, ...newOnes];
      await sset(K.startups, S.startups);
      S.csvPreview = null;
      toast('Startups saved');
      render();
    };
  }
  const cancelBtn = document.getElementById('cancelPreview');
  if(cancelBtn) cancelBtn.onclick = ()=>{ S.csvPreview=null; render(); };

  document.querySelectorAll('[data-delete-startup]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Delete this startup? This will not delete existing scores.')) return;
      S.startups = S.startups.filter(s=>s.id !== b.dataset.deleteStartup);

/* ---- Admin: Results tab ---- */
function scoresForStartup(startupId){
  return Object.entries(S.scores)
    .filter(([k,v])=> k.split('::')[1] === startupId)
    .map(([k,v])=>({ evaluatorId:k.split('::')[0], ...v }));
}
function avgOf(nums){ if(!nums.length) return null; return (nums.reduce((a,b)=>a+b,0)/nums.length); }

function scoreRowTotal(row, rubric){
  if(!row.subScores) return null;
  const vals = rubric.flatMap(cat=>cat.subcriteria.map(sub=>row.subScores[sub.key])).filter(v=>typeof v==='number');
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0);
}
function categoryTotal(row, cat){
  const vals = cat.subcriteria.map(sub=>row.subScores ? row.subScores[sub.key] : undefined).filter(v=>typeof v==='number');
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0);
}

          const avgTotal = avgOf(totals);

          return `

              ${rubric.map(cat=>{

            </div>
          </td></tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

}

/* ---- Evaluator detail (scoring + info) ---- */
function ensureDraftScore(ev, s){
  const key = ev.id+'::'+s.id;
  if(!draftScore || draftScore._key !== key){
    const raw = S.scores[key] || {};
    draftScore = {
      _key: key,
      subScores: { ...(raw.subScores||{}) },
      goNoGo: raw.goNoGo || null,
      comments: raw.comments || ''
    };
  }
  return draftScore;
}

function categorySubtotal(cat, draft){
  return cat.subcriteria.reduce((sum, sub) => sum + (draft.subScores[sub.key] ?? 0), 0);
}

async function persistDraft(ev, s, draft){
  S.scores[draft._key] = {
    subScores: { ...draft.subScores },
    goNoGo: draft.goNoGo,
    comments: draft.comments,
    updatedAt: Date.now()
  };
  await sset(K.scores, S.scores);
}

// Small debounce so we don't write to Firestore on every keystroke in the comments box
let _commentsAutosaveTimer = null;
function debounceAutosave(ev, s, draft){
  clearTimeout(_commentsAutosaveTimer);
  _commentsAutosaveTimer = setTimeout(()=>{ persistDraft(ev, s, draft); }, 1000);
}

  const ev = S.evaluator;
  const s = S.startups.find(x=>x.id===S.currentStartupId);
  const rubric = getRubric(s);

  if(!rubric){
    const track = s.track || 'pre-seed';
    const msg = !s.type
      ? "This startup doesn't have a Type set yet, so the right scoring rubric can't be loaded. Ask the admin to set its Type (Deeptech or Tech-enabled) in the Startups tab."

      <div class="type-warning">${esc(msg)}</div>
    </div>
    <div class="toast" id="toast"></div>`;
  }

  const draft = ensureDraftScore(ev, s);
  const totalSteps = rubric.length + 1; // + final Go/No-Go & comments step
  const step = Math.min(S.scoringStep || 0, totalSteps - 1);
  const isFinalStep = step >= rubric.length;
  const currentCat = isFinalStep ? null : rubric[step];

  const stepperHtml = `

      ${rubric.map((cat, i) => `

        <span>Go/No-Go &amp; Notes</span>
        <span class="step-sub">${draft.goNoGo ? (draft.goNoGo==='go'?'Go':'No-Go') : '—'}</span>
      </div>
    </div>`;

  let bodyHtml;
  if(isFinalStep){
    const overallTotal = rubric.reduce((sum,cat)=>sum+categorySubtotal(cat,draft),0);
    bodyHtml = `
      <div class="detail-shell">
        <div class="panel-left">
          <h3 style="margin-top:0;">Final call — ${esc(s.name)}</h3>
          <div class="rubric-total-bar"><span class="label">Overall total</span><span class="value">${overallTotal} / ${rubricMaxTotal(rubric)}</span></div>
          <div class="gonogo-row">
            <button type="button" class="gonogo-btn go ${draft.goNoGo==='go'?'selected':''}" data-gonogo="go">Go</button>
            <button type="button" class="gonogo-btn nogo ${draft.goNoGo==='no-go'?'selected':''}" data-gonogo="no-go">No-Go</button>
          </div>
          <div class="field">
            <label>Comments</label>
            <textarea id="commentsInput" rows="8" placeholder="Notes for the investment committee…">${esc(draft.comments||'')}</textarea>
          </div>
          <div class="step-nav">
            <button type="button" class="btn btn-ghost" id="stepPrev">&larr; Back</button>
            <button type="button" class="btn btn-primary" id="saveScoreBtn">Save &amp; finish</button>
          </div>
        </div>
        <div class="panel-right">
          <div class="info-block">
            <h4>Review before you submit</h4>
            <div class="kv">
              ${rubric.map(cat=>`<div>${esc(cat.label)}</div><div>${categorySubtotal(cat,draft)} / ${cat.maxPoints}</div>`).join('')}
            </div>
          </div>
          <p class="su-meta">Click any category above to go back and adjust a score before finishing.</p>
          <div class="info-block">
            <h4>Investment memo</h4>
            <div class="memo-text">${s.memo ? esc(s.memo) : '<span style="color:var(--muted);font-style:italic;">No memo written yet.</span>'}</div>
          </div>
        </div>
      </div>`;
  } else {
    if(expandedSubCatId !== currentCat.id){
      const firstUnscored = currentCat.subcriteria.find(sub => draft.subScores[sub.key] === undefined);
      expandedSub = firstUnscored ? firstUnscored.key : null;
      expandedSubCatId = currentCat.id;
    }
    bodyHtml = `
      <div class="detail-shell">
        <div class="panel-left">
          <h3 style="margin-top:0;">${esc(currentCat.label)}</h3>
          <div class="rubric-total-bar">
            <span><span class="label">Category</span> <span class="value" id="catSubtotal">${categorySubtotal(currentCat, draft)}/${currentCat.maxPoints}</span></span>
            <span><span class="label">Overall so far</span> <span class="value" id="overallSubtotal">${rubric.reduce((sum,c)=>sum+categorySubtotal(c,draft),0)}/${rubricMaxTotal(rubric)}</span></span>
          </div>
          ${currentCat.subcriteria.map(sub => {
            const scored = draft.subScores[sub.key] !== undefined;
            const isOpen = sub.key === expandedSub;
            const selectedAnchor = scored ? sub.anchors.find(a=>a.points===draft.subScores[sub.key]) : null;
            const previewText = scored ? (selectedAnchor ? `${selectedAnchor.points} — ${selectedAnchor.label}` : `${draft.subScores[sub.key]} pts`) : 'Not yet scored';
            return `
            <div class="crit-row" data-subkey="${sub.key}">
              <div class="crit-header ${isOpen?'open':''} ${scored?'scored':''}" data-toggle-sub="${sub.key}">
                <div class="crit-header-main">
                  <span class="crit-label">${esc(sub.label)}${scored?' <span class=\"crit-check\">&check;</span>':''}</span>
                  <span class="crit-preview">${esc(previewText)}</span>
                </div>
                <span class="crit-value" data-subtotal-for="${sub.key}">${draft.subScores[sub.key] ?? '—'}/${sub.maxPoints}</span>
                <span class="crit-chevron">${isOpen?'\u25be':'\u25b8'}</span>
              </div>
              ${isOpen ? `
              <div class="anchor-group" data-subkey-group="${sub.key}">
                ${sub.anchors.map(a => `
                  <button type="button" class="anchor-btn ${draft.subScores[sub.key]===a.points?'selected':''}" data-sub="${sub.key}" data-points="${a.points}">
                    <span class="anchor-points">${a.points}</span><span class="anchor-label">${esc(a.label)}</span>
                  </button>`).join('')}
              </div>` : ''}
            </div>`;
          }).join('')}
          <div class="step-nav">
            <button type="button" class="btn btn-ghost" id="stepPrev" ${step===0?'disabled':''}>&larr; Back</button>
            <button type="button" class="btn btn-primary" id="stepNext">${step===rubric.length-1?'Review & finish':'Next section'} &rarr;</button>
          </div>
        </div>
        <div class="panel-right">
          <div class="info-block">
            <h4>Company Basics</h4>
            <div class="kv">
              <div>Sector</div><div>${esc(s.sector||'—')}</div>
              <div>Type</div><div>${s.type ? (s.type==='deeptech'?'Deeptech':'Tech-enabled') : '—'}</div>
              <div>Country</div><div>${esc(s.country||'—')}</div>
              <div>Website</div><div>${s.website ? asLink(s.website) : '—'}</div>
            </div>
          </div>
          <div class="info-block">
            <h4>${esc(currentCat.label)} — Evidence</h4>
            ${categoryEvidenceHtml(currentCat.id, s)}
            ${categoryQAHtml(currentCat.id, s)}
          </div>
          <div class="info-block">
            <h4>Investment memo</h4>
            <div class="memo-text">${s.memo ? esc(s.memo) : '<span style="color:var(--muted);font-style:italic;">No memo written yet.</span>'}</div>
          </div>
          ${(currentCat.id==='market_fit') ? `
          <div class="info-block">
            <h4>Resources</h4>
            <div class="kv">
              ${s.decks ? `<div>Pitch deck</div><div>${esc(s.decks)}</div>` : ''}
              ${s.videos ? `<div>Videos</div><div>${esc(s.videos)}</div>` : ''}
            </div>
          </div>` : ''}
        </div>
      </div>`;
  }

  return `
  ${topbar(`Logged in as <b>${esc(ev.name)}</b><button class="logout" id="logoutBtn">Log out</button>`)}
  ${stepperHtml}
  <div class="content">
    <button class="back-link back-row" id="backList">&larr; Back to your list</button>
    ${bodyHtml}
  </div>
  <div class="toast" id="toast"></div>`;
}

function attachEvaluatorDetailListeners(){
  const ev = S.evaluator;
  const s = S.startups.find(x=>x.id===S.currentStartupId);
  const rubric = getRubric(s);

  document.getElementById('logoutBtn').onclick = ()=>{ S.view='landing'; S.evaluator=null; S.currentStartupId=null; draftScore=null; render(); };
  document.getElementById('backList').onclick = ()=>{ S.currentStartupId=null; draftScore=null; render(); };

  if(!rubric) return;

  const draft = ensureDraftScore(ev, s);

  // Clicking any stepper dot jumps straight to that category/step (autosaving first)
  document.querySelectorAll('[data-step]').forEach(dot=>{
    dot.onclick = async ()=>{
      await persistDraft(ev, s, draft);
      S.scoringStep = +dot.dataset.step;
      render();
    };
  });

  const prevBtn = document.getElementById('stepPrev');
  if(prevBtn){
    prevBtn.onclick = async ()=>{
      await persistDraft(ev, s, draft);
      S.scoringStep = Math.max(0, (S.scoringStep||0) - 1);
      render();
    };
  }
  const nextBtn = document.getElementById('stepNext');
  if(nextBtn){
    nextBtn.onclick = async ()=>{
      await persistDraft(ev, s, draft);
      S.scoringStep = (S.scoringStep||0) + 1;
      render();
    };
  }

  // Header click manually expands/collapses a sub-criterion (only one open at a time)
  document.querySelectorAll('[data-toggle-sub]').forEach(header=>{
    header.onclick = ()=>{
      const key = header.dataset.toggleSub;
      expandedSub = (expandedSub === key) ? null : key;
      render();
      const row = document.querySelector(`[data-subkey="${expandedSub}"]`);
      if(row) row.scrollIntoView({behavior:'smooth', block:'center'});
    };
  });

  // Selecting an answer records the score, then auto-advances the accordion to the next
  // unscored sub-criterion in this category, keeping it one decision at a time.
  document.querySelectorAll('.anchor-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const subkey = btn.dataset.sub;
      draft.subScores[subkey] = +btn.dataset.points;
      persistDraft(ev, s, draft); // autosave immediately, don't wait for step navigation
      const currentCat = rubric[S.scoringStep];
      const idx = currentCat.subcriteria.findIndex(sub=>sub.key===subkey);
      const nextUnscored = currentCat.subcriteria.find((sub,i)=> i>idx && draft.subScores[sub.key]===undefined)
        || currentCat.subcriteria.find(sub=>draft.subScores[sub.key]===undefined);
      expandedSub = nextUnscored ? nextUnscored.key : null;
      render();
      const target = nextUnscored
        ? document.querySelector(`[data-subkey="${nextUnscored.key}"]`)
        : document.getElementById('stepNext');
      if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
    };
  });

  document.querySelectorAll('.gonogo-btn').forEach(btn=>{
    btn.onclick = ()=>{
      draft.goNoGo = btn.dataset.gonogo;
      document.querySelectorAll('.gonogo-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      persistDraft(ev, s, draft); // autosave immediately
    };
  });

  const commentsInput = document.getElementById('commentsInput');
  if(commentsInput){
    commentsInput.oninput = ()=>{
      draft.comments = commentsInput.value;
      debounceAutosave(ev, s, draft); // autosave shortly after typing pauses
    };
  }

  const saveBtn = document.getElementById('saveScoreBtn');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      await persistDraft(ev, s, draft);
      toast('Score saved');
      S.currentStartupId = null;
      draftScore = null;
      render();
    };
  }
}

/* patch attachEvaluatorShell to also wire detail view */
const _origAttachEvaluatorShell = attachEvaluatorShell;
attachEvaluatorShell = function(){
  if(S.currentStartupId){ attachEvaluatorDetailListeners(); return; }
  _origAttachEvaluatorShell();
};

/* ============ UTIL ============ */
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escAttr(str){ return esc(str); }
function asLink(value){
  if(!value) return '—';
  let href = String(value).trim();
  if(!/^https?:\/\//i.test(href)) href = 'https://' + href.replace(/^\/\//,'');
  return `<a href="${escAttr(href)}" target="_blank" rel="noopener">${esc(value)}</a>`;
}

function categoryEvidenceHtml(catId, s){
  // With rich application data, the raw Q&A list (categoryQAHtml) is the sole source of
  // truth, no paraphrasing, no merged summaries. This fallback only kicks in for startups
  // imported before the rich application sheet existed, so something reasonable still shows.
  if(s.application) return '';

  const has = (v) => v !== undefined && v !== null && String(v).trim() !== '';
  const row = (label, val) => has(val) ? `<div>${esc(label)}</div><div>${esc(val)}</div>` : '';
  const gapNote = (text) => `<p class="su-meta" style="margin:8px 0 0;font-style:italic;">${esc(text)}</p>`;

  if(catId === 'team'){
    const founderRows = (s.founderList||[]).length
      ? `<div class="kv">${s.founderList.map(f=>`<div>${esc(f.name)}</div><div>${esc(f.role||'—')}</div>`).join('')}</div>`
      : `<div class="memo-text">${esc(s.founders || 'No founder info provided.')}</div>`;
    const teamSize = (s.founderList||[]).length;
    return `
      ${founderRows}
      <div class="kv" style="margin-top:10px;">
        ${row('Team size (from founders listed)', teamSize ? teamSize+' founder(s) listed' : '')}
        ${row('University', s.university)}
      </div>
      ${gapNote('Full-time commitment, gender/age breakdown, and detailed credentials aren\u2019t separate fields in this export, check the deck or ask directly if not otherwise known.')}
    `;
  }

  if(catId === 'traction'){
    return `
      <div class="kv">
        ${row('Milestone', s.milestone)}
        ${row('Incorporated', s.incorporated)}
        ${row('Revenue model', s.revenueModel)}
        ${row('Revenue (last month)', s.revLastMonth)}
        ${row('Revenue (last 12mo)', s.revLast12Months)}
        ${row('Clients', s.clients)}
        ${row('Cash runway', s.cashRunway)}
      </div>
      ${!has(s.milestone) && !has(s.revLastMonth) && !has(s.clients) ? gapNote('No traction figures were provided in the export, this may need to be scored 0 or verified with the founders.') : gapNote('Technology readiness (TRL) and IP/patent status aren\u2019t separate fields, infer from Milestone/Differentiators or the deck.')}
    `;
  }

  if(catId === 'solution'){
    return `
      ${gapNote('Competitive positioning and measurable social/environmental impact often aren\u2019t explicit here, look for it in the text above or the deck.')}
    `;
  }

  if(catId === 'fundraising'){
    return `
      <div class="kv">
        ${row('Total funding to date', s.totalFunding)}
        ${row('Round amount', has(s.roundAmount) ? s.roundAmount + (has(s.roundAmountCurrency)?' '+s.roundAmountCurrency:'') : '')}
        ${row('Round valuation', has(s.roundValuation) ? s.roundValuation + (has(s.roundValuationCurrency)?' '+s.roundValuationCurrency:'') : '')}
        ${row('Round status', s.roundStatus)}
        ${row('Round type', s.roundType)}
        ${row('Last updated', s.roundUpdated)}
      </div>
      ${!has(s.totalFunding) && !has(s.roundAmount) ? gapNote('No fundraising figures provided, likely scores low on this category unless the deck/notes clarify an ask.') : gapNote('A specific funding ask (amount, use of funds, stage) isn\u2019t always a separate field, check the deck or notes for the exact ask.')}
    `;
  }

  if(catId === 'market_fit'){
    return `
      <div class="kv">
        ${row('Location', s.country)}
        ${row('Markets / sector', s.sector)}
      </div>
      ${gapNote('Go-to-market plan and international expansion strategy are rarely separate export fields, this is usually the most deck-dependent category, open the pitch deck below before scoring it.')}
    `;
  }

  return '';
}

/* ============ GLOBAL HOME BUTTON (delegated, survives re-renders) ============ */
document.addEventListener('click', (e)=>{
  const brandEl = e.target.closest('#brandHome');
  if(!brandEl) return;
  if(S.evaluator){
    S.view = 'evaluator';
    S.currentStartupId = null;
    S.evaluatorHome = true;
    draftScore = null;
    render();
  } else if(S.adminAuthed){
    S.view = 'admin';
    S.adminTab = 'startups';
    S.csvPreview = null;
    render();
  } else {
    S.view = 'landing';
    render();
  }
});

/* ============ INIT ============ */
loadAll();
